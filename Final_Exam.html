<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCNA 1 v7 - اختبار تفاعلي كامل (مترجم + داكن/فاتح)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            padding: 20px;
            min-height: 100vh;
        }
        body.dark {
            background: #1a1a2e;
            color: #e0e0e0;
        }
        body.dark .container {
            background: #2d2d44;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        body.dark .exam-meta {
            background: #3d3d5c;
            color: #ddd;
        }
        body.dark .question-container {
            background: #38385a;
            border-left-color: #4a90d9;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        body.dark .question-container.correct {
            border-left-color: #28a745;
            background: #2a4a3a;
        }
        body.dark .question-container.incorrect {
            border-left-color: #dc3545;
            background: #4a2a2a;
        }
        body.dark .option-item {
            background: #3d3d5c;
            border-color: #555577;
        }
        body.dark .option-item:hover {
            background: #4a4a70;
        }
        body.dark .option-item.correct-answer {
            background: #2a6a3a;
            border-color: #28a745;
        }
        body.dark .option-item.wrong-answer {
            background: #6a2a2a;
            border-color: #dc3545;
        }
        body.dark .option-item.missed-correct {
            background: #2a5a4a;
            border-color: #28a745;
            opacity: 0.7;
        }
        body.dark .btn-outline {
            color: #4a90d9;
            border-color: #4a90d9;
        }
        body.dark .btn-outline:hover {
            background: #4a90d9;
            color: #fff;
        }
        body.dark .score-section {
            background: #3d3d5c;
        }
        body.dark .explanation {
            background: #3a3a55;
            border-left-color: #6c757d;
        }
        body.dark .matching-col select {
            background: #3d3d5c;
            color: #e0e0e0;
            border-color: #555577;
        }
        body.dark .matching-col select.correct-match {
            border-color: #28a745;
            background: #2a4a3a;
        }
        body.dark .matching-col select.wrong-match {
            border-color: #dc3545;
            background: #4a2a2a;
        }
        body.dark .tag {
            background: #4a4a6a;
            color: #ccc;
        }
        body.dark .tag.multi {
            background: #1a3a6a;
            color: #aaccff;
        }
        body.dark .tag.match {
            background: #1a4a3a;
            color: #aaffcc;
        }
        body.dark .reset-link {
            color: #aab;
        }
        body.dark .reset-link:hover {
            color: #4a90d9;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            padding: 30px 35px;
            position: relative;
        }
        h1 {
            font-size: 28px;
            color: #0a2540;
            border-bottom: 3px solid #0056a7;
            padding-bottom: 14px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        body.dark h1 {
            color: #d0d0e0;
            border-bottom-color: #4a90d9;
        }
        h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #555;
        }
        body.dark h1 small {
            color: #aaa;
        }
        .exam-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            background: #e8edf3;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .exam-meta .badge {
            background: #0056a7;
            color: #fff;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
        }
        body.dark .exam-meta .badge {
            background: #4a90d9;
        }
        .question-container {
            margin-bottom: 32px;
            padding: 22px 25px;
            background: #fafbfc;
            border-radius: 12px;
            border-left: 5px solid #0056a7;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: background 0.2s;
        }
        .question-container.correct {
            border-left-color: #28a745;
            background: #f0fff4;
        }
        .question-container.incorrect {
            border-left-color: #dc3545;
            background: #fff5f5;
        }
        .question-number {
            font-weight: 700;
            color: #0056a7;
            font-size: 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        body.dark .question-number {
            color: #4a90d9;
        }
        .question-number .status-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 20px;
            background: #e9ecef;
            color: #495057;
        }
        .question-number .status-badge.correct-badge {
            background: #28a745;
            color: #fff;
        }
        .question-number .status-badge.wrong-badge {
            background: #dc3545;
            color: #fff;
        }
        .question-text {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-left: 8px;
        }
        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px 14px;
            border-radius: 8px;
            background: #fff;
            border: 1px solid #e2e8f0;
            transition: all 0.15s;
            cursor: pointer;
        }
        .option-item:hover {
            background: #f1f5f9;
            border-color: #b0c4de;
        }
        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            accent-color: #0056a7;
            cursor: pointer;
        }
        .option-item label {
            flex: 1;
            cursor: pointer;
            font-size: 15px;
            line-height: 1.5;
            padding: 2px 0;
        }
        .option-item.correct-answer {
            background: #d4edda;
            border-color: #28a745;
        }
        .option-item.wrong-answer {
            background: #f8d7da;
            border-color: #dc3545;
        }
        .option-item.missed-correct {
            background: #d4edda;
            border-color: #28a745;
            opacity: 0.75;
        }
        .matching-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 40px;
            margin-top: 10px;
            padding: 10px 0;
        }
        .matching-col {
            flex: 1 1 200px;
            min-width: 160px;
        }
        .matching-col label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 6px;
        }
        body.dark .matching-col label {
            color: #ccc;
        }
        .matching-col select {
            width: 100%;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            font-size: 14px;
            background: #fff;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .matching-col select:focus {
            border-color: #0056a7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 86, 167, 0.2);
        }
        .matching-col select.correct-match {
            border-color: #28a745;
            background: #f0fff4;
        }
        .matching-col select.wrong-match {
            border-color: #dc3545;
            background: #fff5f5;
        }
        .matching-pair {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 14px;
        }
        .matching-pair .left-item {
            font-weight: 500;
            min-width: 100px;
        }
        .matching-pair select {
            flex: 1;
            min-width: 100px;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 4px 6px 4px 0;
        }
        .btn-primary {
            background: #0056a7;
            color: #fff;
        }
        .btn-primary:hover {
            background: #003d7a;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0, 86, 167, 0.3);
        }
        .btn-success {
            background: #28a745;
            color: #fff;
        }
        .btn-success:hover {
            background: #1e7e34;
        }
        .btn-danger {
            background: #dc3545;
            color: #fff;
        }
        .btn-danger:hover {
            background: #b02a37;
        }
        .btn-outline {
            background: transparent;
            color: #0056a7;
            border: 2px solid #0056a7;
        }
        .btn-outline:hover {
            background: #0056a7;
            color: #fff;
        }
        .btn-sm {
            padding: 4px 14px;
            font-size: 13px;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 20px 0 10px;
            border-top: 1px solid #e9ecef;
            margin-top: 10px;
        }
        body.dark .actions {
            border-top-color: #444;
        }
        .score-section {
            background: #e8edf3;
            padding: 18px 25px;
            border-radius: 12px;
            margin: 20px 0 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        .score-section .score-number {
            font-size: 32px;
            font-weight: 700;
            color: #0056a7;
        }
        body.dark .score-section .score-number {
            color: #4a90d9;
        }
        .score-section .score-detail {
            font-size: 15px;
            color: #2c3e50;
        }
        body.dark .score-section .score-detail {
            color: #ccc;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 4px;
            margin: 10px 0 20px;
            overflow: hidden;
        }
        body.dark .progress-bar {
            background: #444466;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #0056a7, #4a90d9);
            transition: width 0.3s;
            border-radius: 4px;
        }
        .reset-link {
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
            border-bottom: 1px dashed #adb5bd;
            padding-bottom: 2px;
            cursor: pointer;
        }
        .reset-link:hover {
            color: #0056a7;
            border-bottom-color: #0056a7;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #6c757d;
            border-top: 1px solid #e9ecef;
            padding-top: 20px;
        }
        body.dark .footer {
            border-top-color: #444;
            color: #888;
        }
        .tag {
            display: inline-block;
            background: #e9ecef;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #495057;
            margin-left: 8px;
        }
        .tag.multi {
            background: #cfe2ff;
            color: #0a58ca;
        }
        .tag.match {
            background: #d1e7dd;
            color: #0a5e2e;
        }
        .explanation {
            margin-top: 12px;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #6c757d;
            font-size: 14px;
            color: #2c3e50;
            display: none;
        }
        .explanation.show {
            display: block;
        }
        .explanation strong {
            color: #0056a7;
        }
        body.dark .explanation strong {
            color: #4a90d9;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1a2e;
            color: #fff;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 999;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.success {
            background: #28a745;
        }
        .toast.error {
            background: #dc3545;
        }
        .toast.info {
            background: #0056a7;
        }
        body.dark .toast {
            background: #3d3d5c;
        }
        .hint {
            font-size: 13px;
            color: #6c757d;
            margin-top: 6px;
            font-style: italic;
        }
        body.dark .hint {
            color: #aaa;
        }

        /* Dark/Light toggle */
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            background: #e8edf3;
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid #ccc;
        }
        body.dark .theme-toggle {
            background: #3d3d5c;
            border-color: #555;
            color: #ddd;
        }
        .theme-toggle input {
            display: none;
        }
        .theme-toggle .slider {
            width: 40px;
            height: 20px;
            background: #ccc;
            border-radius: 20px;
            position: relative;
            transition: 0.3s;
        }
        .theme-toggle .slider::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.3s;
        }
        body.dark .theme-toggle .slider {
            background: #4a90d9;
        }
        body.dark .theme-toggle .slider::after {
            left: 22px;
        }

        .lang-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            background: #e8edf3;
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        body.dark .lang-toggle {
            background: #3d3d5c;
            border-color: #555;
            color: #ddd;
        }
        .lang-toggle .lang-label {
            font-weight: 600;
        }

        .top-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }
            h1 {
                font-size: 22px;
            }
            .question-container {
                padding: 16px 18px;
            }
            .question-text {
                font-size: 15px;
            }
            .matching-grid {
                flex-direction: column;
                gap: 12px;
            }
            .matching-col {
                flex: 1 1 100%;
            }
            .actions .btn {
                flex: 1 1 100%;
                text-align: center;
            }
            .score-section {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
            .top-controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <h1>
            <span>🧠 CCNA 1 v7 – اختبار تفاعلي</span>
            <small>جميع الأسئلة · عشوائي في كل زيارة</small>
        </h1>

        <div class="top-controls">
            <div class="exam-meta" style="flex:1; margin-bottom:0;">
                <span>📋 <span id="totalQ">0</span> سؤالاً · <span id="answeredCount">0</span> تمت الإجابة</span>
                <span class="badge">⏱ 75 دقيقة</span>
                <span style="cursor:pointer;" class="reset-link" onclick="resetExam()">🔄 ترتيب عشوائي جديد</span>
            </div>
            <div class="lang-toggle" id="langToggle" onclick="toggleLanguage()">
                <span class="lang-label" id="langLabel">🌐 العربية</span>
            </div>
            <div class="theme-toggle" onclick="toggleTheme()">
                <span>🌓</span>
                <div class="slider"></div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="fill" id="progressFill" style="width:0%;"></div>
        </div>

        <div id="questionsContainer"></div>

        <div class="actions">
            <button class="btn btn-primary" onclick="submitExam()">📤 تسليم الاختبار</button>
            <button class="btn btn-outline" onclick="resetExam()">🔄 إعادة الترتيب</button>
            <button class="btn btn-outline" onclick="showAllExplanations()">📖 عرض كل الشروحات</button>
            <button class="btn btn-outline" onclick="translateAll()">🌐 ترجمة الكل</button>
        </div>

        <div class="score-section" id="scoreSection" style="display:none;">
            <div>
                <span class="score-detail">النتيجة النهائية</span>
                <div class="score-number" id="finalScore">0%</div>
            </div>
            <div>
                <span class="score-detail" id="scoreDetail">0 من 0 صحيحة</span>
                <br>
                <span style="font-size:13px;color:#6c757d;" id="passStatus"></span>
            </div>
        </div>

        <div class="footer">
            CCNA 1 v7 – جميع الأسئلة مأخوذة من الملف · ترتيب عشوائي تلقائي · ترجمة فورية
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ======================================================================
        //  كل الأسئلة (159 سؤالاً) - نفس القائمة السابقة
        // ======================================================================
        const allQuestions = [];

        // -----  سؤال 1  -----
        allQuestions.push({
            id: 1,
            type: 'multi',
            text: 'Which two traffic types use the Real-Time Transport Protocol (RTP)? (Choose two.)',
            options: ['video', 'web', 'file transfer', 'voice', 'peer to peer'],
            correct: [0, 3],
            explanation: 'RTP is designed for real-time data like voice and video. File transfer and web use TCP; peer-to-peer is a network model, not a traffic type.'
        });
        // -----  سؤال 2  -----
        allQuestions.push({
            id: 2,
            type: 'single',
            text: 'Which wireless technology has low-power and low-data-rate requirements, making it popular in IoT environments?',
            options: ['Bluetooth', 'Zigbee', 'WiMAX', 'Wi-Fi'],
            correct: 1,
            explanation: 'Zigbee is an IEEE 802.15.4 standard for low-power, low-data-rate personal-area networks, ideal for IoT and home automation.'
        });
        // -----  سؤال 3  -----
        allQuestions.push({
            id: 3,
            type: 'single',
            text: 'Which layer of the TCP/IP model provides a route to forward messages through an internetwork?',
            options: ['application', 'network access', 'internet', 'transport'],
            correct: 2,
            explanation: 'The internet layer of the TCP/IP model corresponds to the OSI network layer. It handles addressing and routing of messages across networks.'
        });
        // -----  سؤال 4  -----
        allQuestions.push({
            id: 4,
            type: 'single',
            text: 'Which type of server relies on record types such as A, NS, AAAA, and MX in order to provide services?',
            options: ['DNS', 'email', 'file', 'web'],
            correct: 0,
            explanation: 'DNS servers store records: A (IPv4 address), NS (name server), AAAA (IPv6 address), MX (mail exchange).'
        });
        // -----  سؤال 5  -----
        allQuestions.push({
            id: 5,
            type: 'single',
            text: 'What are proprietary protocols?',
            options: [
                'protocols developed by private organizations to operate on any vendor hardware',
                'protocols that can be freely used by any organization or vendor',
                'protocols developed by organizations who have control over their definition and operation',
                'a collection of protocols known as the TCP/IP protocol suite'
            ],
            correct: 2,
            explanation: 'Proprietary protocols are controlled by a single company or vendor. TCP/IP is an open standard, not proprietary.'
        });
        // -----  سؤال 6  -----
        allQuestions.push({
            id: 6,
            type: 'single',
            text: 'What service is provided by DNS?',
            options: [
                'Resolves domain names, such as cisco.com, into IP addresses.',
                'A basic set of rules for exchanging text, graphic images, sound, video, and other multimedia files on the web.',
                'Allows for data transfers between a client and a file server.',
                'Uses encryption to secure the exchange of text, graphic images, sound, and video on the web.'
            ],
            correct: 0,
            explanation: 'DNS (Domain Name System) translates human-readable domain names into numeric IP addresses required for network communication.'
        });
        // -----  سؤال 7  -----
        allQuestions.push({
            id: 7,
            type: 'single',
            text: 'A client packet is received by a server. The packet has a destination port number of 110. What service is the client requesting?',
            options: ['DNS', 'DHCP', 'SMTP', 'POP3'],
            correct: 3,
            explanation: 'Port 110 is the well-known port for POP3 (Post Office Protocol version 3), used for retrieving email from a server.'
        });
        // -----  سؤال 8  -----
        allQuestions.push({
            id: 8,
            type: 'single',
            text: 'What command can be used on a Windows PC to see the IP configuration?',
            options: ['show interfaces', 'ipconfig', 'ifconfig', 'show ip'],
            correct: 1,
            explanation: 'ipconfig is the Windows command to display IP configuration including IPv4, IPv6, subnet mask, and default gateway.'
        });
        // -----  سؤال 9  -----
        allQuestions.push({
            id: 9,
            type: 'single',
            text: 'A wired laser printer is attached to a home computer. That printer has been shared so that other computers on the home network can also use the printer. What networking model is in use?',
            options: ['client-based', 'master-slave', 'point-to-point', 'peer-to-peer (P2P)'],
            correct: 3,
            explanation: 'Peer-to-peer (P2P) networks allow devices to share resources like printers or files without a dedicated server.'
        });
        // -----  سؤال 10  -----
        allQuestions.push({
            id: 10,
            type: 'single',
            text: 'What characteristic describes a virus?',
            options: [
                'an attack that slows or crashes a device service',

        // ---- دوال مساعدة ----
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ---- الحالة العامة ----
        let questions = [];
        let userAnswers = {};
        let submitted = false;
        let currentLang = 'en'; // 'en' or 'ar'
        let translationCache = {}; // تخزين الترجمات

        // ---- ترجمة النص باستخدام Google Translate API (مجاني) ----
        async function translateText(text, targetLang = 'ar') {
            if (!text || text.trim() === '') return text;
            if (targetLang === 'en') return text;
            const cacheKey = text + targetLang;
            if (translationCache[cacheKey]) return translationCache[cacheKey];

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                const translated = data[0][0][0];
                translationCache[cacheKey] = translated;
                return translated;
            } catch (e) {
                console.warn('Translation failed:', e);
                return text;
            }
        }

        // ---- ترجمة كل العناصر المرئية ----
        async function translateAllElements(targetLang = 'ar') {
            const container = document.getElementById('questionsContainer');
            const questionDivs = container.querySelectorAll('.question-container');
            for (const div of questionDivs) {
                const qId = parseInt(div.dataset.qid);
                const q = questions.find(q => q.id === qId);
                if (!q) continue;

                // ترجمة السؤال
                const questionText = div.querySelector('.question-text');
                if (questionText) {
                    const original = q.text;
                    if (targetLang === 'ar') {
                        const translated = await translateText(original, 'ar');
                        questionText.textContent = translated;
                    } else {
                        questionText.textContent = original;
                    }
                }

                // ترجمة الخيارات (للأسئلة العادية)
                const optionItems = div.querySelectorAll('.option-item');
                if (optionItems.length > 0 && q.options) {
                    for (let i = 0; i < optionItems.length; i++) {
                        const label = optionItems[i].querySelector('label');
                        if (label) {
                            const original = q.options[i];
                            if (targetLang === 'ar') {
                                const translated = await translateText(original, 'ar');
                                label.textContent = translated;
                            } else {
                                label.textContent = original;
                            }
                        }
                    }
                }

                // ترجمة التوصيل (المطابقة)
                const matchPairs = div.querySelectorAll('.matching-pair');
                if (matchPairs.length > 0 && q.pairs) {
                    for (let i = 0; i < matchPairs.length; i++) {
                        const leftSpan = matchPairs[i].querySelector('.left-item');
                        if (leftSpan) {
                            const original = q.pairs[i].left;
                            if (targetLang === 'ar') {
                                const translated = await translateText(original, 'ar');
                                leftSpan.textContent = translated;
                            } else {
                                leftSpan.textContent = original;
                            }
                        }
                        // الخيارات في select لا نترجمها لأنها قيم ثابتة (قد تكون أسماء بروتوكولات)
                    }
                }

                // ترجمة الشرح
                const explDiv = div.querySelector('.explanation');
                if (explDiv) {
                    const original = q.explanation;
                    if (targetLang === 'ar') {
                        const translated = await translateText(original, 'ar');
                        explDiv.innerHTML = `<strong>شرح:</strong> ${translated}`;
                    } else {
                        explDiv.innerHTML = `<strong>Explanation:</strong> ${original}`;
                    }
                }
            }
            // تحديث وسم اللغة
            document.getElementById('langLabel').textContent = targetLang === 'ar' ? '🌐 العربية' : '🌐 English';
            currentLang = targetLang;
            showToast(`تم الترجمة إلى ${targetLang === 'ar' ? 'العربية' : 'الإنجليزية'}`, 'info');
        }

        // ---- تبديل اللغة ----
        function toggleLanguage() {
            const newLang = currentLang === 'en' ? 'ar' : 'en';
            translateAllElements(newLang);
        }

        // ---- ترجمة الكل (زر) ----
        function translateAll() {
            toggleLanguage();
        }

        // ---- تبديل الوضع الداكن/الفاتح ----
        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('ccna-theme', isDark ? 'dark' : 'light');
        }

        // ---- تحميل الثيم المحفوظ ----
        function loadTheme() {
            const saved = localStorage.getItem('ccna-theme');
            if (saved === 'dark') {
                document.body.classList.add('dark');
            }
        }

        // ---- دوال الاختبار (معدلة للتعامل مع الترجمة) ----
        function initExam() {
            const shuffled = shuffleArray([...allQuestions]);
            questions = shuffled.map((q, idx) => ({ ...q, displayIndex: idx + 1 }));
            userAnswers = {};
            submitted = false;
            document.getElementById('scoreSection').style.display = 'none';
            renderQuestions();
            updateProgress();
            document.getElementById('totalQ').textContent = questions.length;
            document.getElementById('answeredCount').textContent = 0;
            // إذا كانت اللغة العربية مفعلة نترجم تلقائياً (اختياري)
            if (currentLang === 'ar') {
                setTimeout(() => translateAllElements('ar'), 200);
            }
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            questions.forEach((q, idx) => {
                const div = document.createElement('div');
                div.className = 'question-container';
                div.dataset.qid = q.id;
                div.id = 'q-' + q.id;

                let typeTag = '';
                if (q.type === 'multi') typeTag = '<span class="tag multi">اختيار متعدد</span>';
                else if (q.type === 'match') typeTag = '<span class="tag match">توصيل</span>';
                else typeTag = '<span class="tag">اختيار واحد</span>';

                const numHtml = `<div class="question-number">
                    <span>سؤال ${q.displayIndex} ${typeTag}</span>
                    <span class="status-badge" id="status-${q.id}">⏳ لم يجب</span>
                </div>`;

                let bodyHtml = `<div class="question-text">${q.text}</div>`;

                if (q.type === 'single' || q.type === 'multi') {
                    bodyHtml += `<div class="options" id="options-${q.id}">`;
                    q.options.forEach((opt, oi) => {
                        const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                        const nameAttr = `q${q.id}`;
                        const val = String(oi);
                        bodyHtml += `
                            <div class="option-item" id="opt-${q.id}-${oi}">
                                <input type="${inputType}" name="${nameAttr}" value="${val}" id="inp-${q.id}-${oi}" onchange="onAnswerChange(${q.id})">
                                <label for="inp-${q.id}-${oi}">${opt}</label>
                            </div>
                        `;
                    });
                    bodyHtml += `</div>`;
                    bodyHtml += `<div class="hint">${q.type === 'multi' ? 'اختر جميع الإجابات الصحيحة.' : 'اختر إجابة واحدة.'}</div>`;
                } else if (q.type === 'match') {
                    bodyHtml += `<div class="matching-grid" id="match-${q.id}">`;
                    const shuffledPairs = shuffleArray([...q.pairs]);
                    const rightOptions = [...new Set(shuffledPairs.map(p => p.right))];
                    const shuffledRight = shuffleArray([...rightOptions]);
                    shuffledPairs.forEach((pair, pi) => {
                        const selectId = 'sel-' + q.id + '-' + pi;
                        bodyHtml += `
                            <div class="matching-pair">
                                <span class="left-item">${pair.left}</span>
                                <select id="${selectId}" onchange="onMatchChange(${q.id}, '${pair.left}', this.value)">
                                    <option value="">-- اختر --</option>
                                    ${shuffledRight.map(r => `<option value="${r}">${r}</option>`).join('')}
                                </select>
                            </div>
                        `;
                    });
                    bodyHtml += `</div>`;
                    if (!window._matchData) window._matchData = {};
                    window._matchData[q.id] = {
                        pairs: shuffledPairs,
                        rightOptions: shuffledRight,
                        selections: {}
                    };
                }

                bodyHtml += `
                    <div style="margin-top:10px;">
                        <button class="btn btn-outline btn-sm" onclick="toggleExplanation(${q.id})">📖 شرح</button>
                        <div class="explanation" id="expl-${q.id}">
                            <strong>شرح:</strong> ${q.explanation || 'لا يوجد شرح متاح.'}
                        </div>
                    </div>
                `;

                div.innerHTML = numHtml + bodyHtml;
                container.appendChild(div);
            });
        }

        function onAnswerChange(qId) {
            if (submitted) return;
            const q = questions.find(x => x.id === qId);
            if (!q) return;
            const container = document.getElementById('q-' + qId);
            if (!container) return;

            let selected = [];
            if (q.type === 'single') {
                const checked = container.querySelector(`input[name="q${qId}"]:checked`);
                if (checked) selected = [parseInt(checked.value)];
            } else if (q.type === 'multi') {
                const checked = container.querySelectorAll(`input[name="q${qId}"]:checked`);
                checked.forEach(cb => selected.push(parseInt(cb.value)));
            }
            if (selected.length === 0) {
                delete userAnswers[qId];
            } else {
                userAnswers[qId] = selected;
            }
            updateProgress();
            updateStatusBadge(qId);
        }

        function onMatchChange(qId, leftKey, rightVal) {
            if (submitted) return;
            if (!window._matchData) window._matchData = {};
            if (!window._matchData[qId]) return;
            window._matchData[qId].selections[leftKey] = rightVal;
            const allSelected = window._matchData[qId].selections;
            const allPairs = window._matchData[qId].pairs;
            let allFilled = true;
            for (const p of allPairs) {
                if (!allSelected[p.left] || allSelected[p.left] === '') {
                    allFilled = false;
                    break;
                }
            }
            if (allFilled) {
                userAnswers[qId] = { ...allSelected };
            } else {
                delete userAnswers[qId];
            }
            updateProgress();
            updateStatusBadge(qId);
        }

        function updateProgress() {
            const total = questions.length;
            const answered = Object.keys(userAnswers).filter(key => {
                const val = userAnswers[key];
                if (Array.isArray(val)) return val.length > 0;
                if (typeof val === 'object') return Object.keys(val).length > 0;
                return false;
            }).length;
            document.getElementById('answeredCount').textContent = answered;
            const pct = total > 0 ? (answered / total) * 100 : 0;
            document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
        }

        function updateStatusBadge(qId) {
            const badge = document.getElementById('status-' + qId);
            if (!badge) return;
            const ans = userAnswers[qId];
            let answered = false;
            if (Array.isArray(ans)) answered = ans.length > 0;
            else if (typeof ans === 'object') answered = Object.keys(ans).length > 0;
            if (answered) {
                badge.textContent = '✅ تمت الإجابة';
                badge.style.background = '#28a745';
                badge.style.color = '#fff';
            } else {
                badge.textContent = '⏳ لم يجب';
                badge.style.background = '#e9ecef';
                badge.style.color = '#495057';
            }
        }

        function toggleExplanation(qId) {
            const el = document.getElementById('expl-' + qId);
            if (el) el.classList.toggle('show');
        }

        function showAllExplanations() {
            questions.forEach(q => {
                const el = document.getElementById('expl-' + q.id);
                if (el) el.classList.add('show');
            });
            showToast('تم عرض جميع الشروحات', 'info');
        }

        function submitExam() {
            if (submitted) {
                showToast('تم التسليم مسبقاً', 'info');
                return;
            }
            const total = questions.length;
            const answered = Object.keys(userAnswers).filter(key => {
                const val = userAnswers[key];
                if (Array.isArray(val)) return val.length > 0;
                if (typeof val === 'object') return Object.keys(val).length > 0;
                return false;
            }).length;

            if (answered < total) {
                if (!confirm(`لم تجب على ${total - answered} سؤالاً. هل تريد التسليم على أي حال؟`)) {
                    return;
                }
            }

            submitted = true;
            let correctCount = 0;

            questions.forEach(q => {
                const container = document.getElementById('q-' + q.id);
                if (!container) return;
                let isCorrect = false;

                if (q.type === 'single') {
                    const userVal = userAnswers[q.id];
                    const correctVal = q.correct;
                    const isRight = Array.isArray(userVal) && userVal.length === 1 && userVal[0] === correctVal;
                    isCorrect = isRight;
                    const optDivs = container.querySelectorAll('.option-item');
                    optDivs.forEach((div, idx) => {
                        const inp = div.querySelector('input');
                        if (inp && inp.checked) {
                            if (idx === correctVal) div.classList.add('correct-answer');
                            else div.classList.add('wrong-answer');
                        } else if (idx === correctVal) {
                            div.classList.add('missed-correct');
                        }
                    });
                    if (isRight) correctCount++;
                    container.classList.add(isRight ? 'correct' : 'incorrect');

                } else if (q.type === 'multi') {
                    const userVal = userAnswers[q.id] || [];
                    const correctVals = q.correct || [];
                    const sortedUser = [...userVal].sort();
                    const sortedCorrect = [...correctVals].sort();
                    const isRight = sortedUser.length === sortedCorrect.length &&
                        sortedUser.every((v, i) => v === sortedCorrect[i]);
                    isCorrect = isRight;
                    const optDivs = container.querySelectorAll('.option-item');
                    optDivs.forEach((div, idx) => {
                        const inp = div.querySelector('input');
                        if (inp && inp.checked) {
                            if (correctVals.includes(idx)) div.classList.add('correct-answer');
                            else div.classList.add('wrong-answer');
                        } else if (correctVals.includes(idx)) {
                            div.classList.add('missed-correct');
                        }
                    });
                    if (isRight) correctCount++;
                    container.classList.add(isRight ? 'correct' : 'incorrect');

                } else if (q.type === 'match') {
                    const userVal = userAnswers[q.id] || {};
                    const correctMap = q.correct || {};
                    let allMatch = true;
                    const pairs = window._matchData && window._matchData[q.id] ? window._matchData[q.id].pairs : [];
                    for (const p of pairs) {
                        const userRight = userVal[p.left] || '';
                        const expected = correctMap[p.left] || '';
                        if (userRight !== expected) allMatch = false;
                        const selects = container.querySelectorAll(`select[id^="sel-${q.id}-"]`);
                        selects.forEach(s => {
                            const leftKey = s.closest('.matching-pair').querySelector('.left-item')
                            .textContent.trim();
                            const val = s.value;
                            const expectedVal = correctMap[leftKey] || '';
                            if (val === expectedVal) s.classList.add('correct-match');
                            else if (val !== '') s.classList.add('wrong-match');
                        });
                    }
                    isCorrect = allMatch;
                    if (isCorrect) correctCount++;
                    container.classList.add(isCorrect ? 'correct' : 'incorrect');
                }

                const badge = document.getElementById('status-' + q.id);
                if (badge) {
                    badge.textContent = isCorrect ? '✅ صحيح' : '❌ خطأ';
                    badge.style.background = isCorrect ? '#28a745' : '#dc3545';
                    badge.style.color = '#fff';
                }
            });

            const score = Math.round((correctCount / total) * 100);
            const passed = score >= 70;
            document.getElementById('scoreSection').style.display = 'flex';
            document.getElementById('finalScore').textContent = score + '%';
            document.getElementById('scoreDetail').textContent = `${correctCount} من ${total} صحيحة`;
            document.getElementById('passStatus').textContent = passed ? '✅ نجاح' : '❌ رسوب (70% مطلوب)';
            document.getElementById('passStatus').style.color = passed ? '#28a745' : '#dc3545';

            document.querySelectorAll('input, select').forEach(el => el.disabled = true);
            showToast(`النتيجة: ${score}% (${correctCount}/${total})`, passed ? 'success' : 'error');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetExam() {
            if (submitted || Object.keys(userAnswers).length > 0) {
                if (!confirm('سيتم إعادة ترتيب جميع الأسئلة وفقد الإجابات الحالية. متابعة؟')) {
                    return;
                }
            }
            window._matchData = {};
            initExam();
            document.querySelectorAll('.explanation').forEach(el => el.classList.remove('show'));
            showToast('تم إعادة ترتيب الأسئلة عشوائياً', 'info');
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type + ' show';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ---- بدء التشغيل ----
        window.onload = function() {
            loadTheme();
            initExam();
            // اختصار Ctrl+Enter للتسليم
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.ctrlKey) {
                    e.preventDefault();
                    submitExam();
                }
            });
        };
    </script>

</body>
</html>
